<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>LoginPage</title>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/global.css">

</head>

<div class="container-fluid mt-5" style="width: 80rem;">
	<div class="row justify-content-center">
		<div class="col-sm-8 col-md-6">
			<th:insert th:replace="~{layout}" />
			<div class="form-header" style="margin-bottom: 20px;">
				<h2>로그인</h2>
			</div>
			<div class="card"
				style="padding: 20px; border: none; box-shadow: none; background: transparent;">
				<div class="card-body">
					<form id="userlogin">
						<div class="form-group mb-3">
							<label for="userId" class="form-label">아이디</label> <input
								type="text" class="form-control" id="userId" name="userId"
								required>
						</div>
						<div class="form-group mb-4">
							<label for="password" class="form-label">비밀번호</label> <input
								type="password" class="form-control" id="password"
								name="password" required>
						</div>
						<button type="submit" class="btn btn-primary w-100">로그인</button>
					</form>
				</div>
				<div class="card-footer text-center bg-transparent border-0 pt-3">
					<div class="d-flex justify-content-center gap-3">
						<a href="/user/joinPage">회원가입</a> <span>|</span> <a
							href="/user/find">ID/PW 찾기</a>
					</div>
				</div>
				<!-- </div> -->
			</div>
		</div>
	</div>
</div>


<script>
    $(document).ready(function() {
        $('#userlogin').on('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const password = formData.get('password');

            // Simple validation
            if (!formData.get('userId') || !password) {
                showAlert('아이디와 비밀번호를 모두 입력해주세요.', 'warning');
                return;
            }

            try {
                const response = await fetch('/user/login', {
                    method: 'POST',
                    body: new URLSearchParams(formData) // Sending as x-www-form-urlencoded
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();

                console.log("데이트 확인 :;;;  " + result.resultCode);

                if (result.resultCode == "200") { // Assuming "1" is success
                    showAlert("로그인 성공!", "success");
                    window.location.href = "/todo"; // Redirect to main page on success
                } else {
                    showAlert("로그인 실패: " + (result.message || "아이디 또는 비밀번호가 올바르지 않습니다."), "danger");
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('로그인 중 오류가 발생했습니다.', 'danger');
            }
        });
    });
</script>
</html>
