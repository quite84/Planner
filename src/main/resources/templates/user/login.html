<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>LoginPage</title>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/global.css">

</head>

<div class="container">

	<div class="form-header" style="margin-bottom: 20px;">
		<h2>로그인</h2>
	</div>
	<div class="card"
		style="padding: 20px; border: none; box-shadow: none; background: transparent;">
		<div class="card-body">
			<form id="userlogin">
				<div class="form-group mb-3">
					<label for="userId" class="form-label">아이디</label> <input
						type="text" class="form-control" id="userId" name="userId"
						required>
				</div>
				<div class="form-group mb-4">
					<label for="password" class="form-label">비밀번호</label> <input
						type="password" class="form-control" id="password" name="password"
						required>
				</div>
				<button type="submit" class="btn btn-primary w-100">로그인</button>
			</form>
		</div>
		<div class="card-footer text-center bg-transparent border-0 pt-3">
			<div class="d-flex justify-content-center gap-3">
				<a href="/user/joinPage">회원가입</a> <span>|</span> <a
					href="/user/find">ID/PW 찾기</a>
			</div>
		</div>
		<!-- </div> -->
	</div>

	<script>
        document.getElementById('userlogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            // const password = formData.get('password');

            // Simple validation
            if (!formData.get('userId') || !password) {
                alert('아이디와 비밀번호를 모두 입력해주세요.');
                return;
            }

            try {
                // const encoder = new TextEncoder();
                // const data = encoder.encode(password);
                // const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                // const hashArray = Array.from(new Uint8Array(hashBuffer));
                // const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                // formData.set("password", hashHex);

                const response = await fetch('/user/login', {
                    method: 'POST',
                    body: new URLSearchParams(formData) // Sending as x-www-form-urlencoded
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();

                if (result.resultCode === "200") { // Assuming "1" is success
                    alert("로그인 성공!");
                    window.location.href = "/todo"; // Redirect to main page on success
                } else {
                    alert("로그인 실패: " + (result.message || "아이디 또는 비밀번호가 올바르지 않습니다."));
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('로그인 중 오류가 발생했습니다.');
            }
        });
    </script>
</div>
</html>
