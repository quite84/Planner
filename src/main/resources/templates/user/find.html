<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find ID/Password</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .nav-tabs .nav-link {
            border: 1px solid transparent;
            border-top-left-radius: .25rem;
            border-top-right-radius: .25rem;
            color: #007bff;
        }

        .nav-tabs .nav-link.active {
            color: #495057;
            background-color: #fff;
            border-color: #dee2e6 #dee2e6 #fff;
        }
    </style>
</head>
<body>
    <div class="container">
    <th:insert th:replace="~{layout}" />
        <div class="form-header">
            <h2>아이디/비밀번호 찾기</h2>
        </div>
        
        <ul class="nav nav-tabs" id="findTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="find-id-tab" data-bs-toggle="tab" data-bs-target="#find-id" type="button" role="tab" aria-controls="find-id" aria-selected="true">아이디 찾기</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="find-pw-tab" data-bs-toggle="tab" data-bs-target="#find-pw" type="button" role="tab" aria-controls="find-pw" aria-selected="false">비밀번호 찾기</button>
            </li>
        </ul>

        <div class="tab-content" id="findTabContent" style="padding-top: 20px;">
            <!-- 아이디 찾기 탭 -->
            <div class="tab-pane fade show active" id="find-id" role="tabpanel" aria-labelledby="find-id-tab">
                <form id="findIdForm">
                    <div class="form-group">
                        <label for="userName">이름</label>
                        <input type="text" class="form-control" id="userName" name="userName" placeholder="가입 시 입력한 이름" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">이메일</label>
                        <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="가입 시 입력한 이메일" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">아이디 찾기</button>
                </form>
            </div>
            
            <!-- 비밀번호 찾기 탭 -->
            <div class="tab-pane fade" id="find-pw" role="tabpanel" aria-labelledby="find-pw-tab">
                <form id="findPwForm">
                    <div class="form-group">
                        <label for="userId">아이디</label>
                        <input type="text" class="form-control" id="userId" name="userId" placeholder="아이디" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">이메일</label>
                        <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="가입 시 입력한 이메일" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">임시 비밀번호 발급</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="/user/loginPage">로그인 페이지로 돌아가기</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

<script>
document.getElementById('findIdForm').addEventListener('submit', async function(e) {
	e.preventDefault();
	const formData = new FormData(this);
	try{
		const response = await fetch('/user/findByName', {
            method: 'POST',
            body: new URLSearchParams(formData) // Sending as x-www-form-urlencoded
        });
        
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        const result = await response.json();
        
        if(result.resultCode === '200'){
        	showAlert("고객님의 ID는 ::: " + result.message + " 입니다.", "success");
            showConfirm("로그인 화면으로 이동 할까요?", () => {
                window.location.href="/user/loginPage";
            });
        }else{
        	showAlert(result.message, "danger");
        }
	}catch (error) {
        console.error('error:', error);
        showAlert('오류가 발생했습니다.', 'danger');
    }
});

document.getElementById('findPwForm').addEventListener('submit', async function(e) {
	e.preventDefault();
	const formData = new FormData(this);
	try{
		const response = await fetch('/user/findById', {
            method: 'POST',
            body: new URLSearchParams(formData) // Sending as x-www-form-urlencoded
        });
        
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        const result = await response.json();
        showAlert(result.message, "info");
	}catch (error) {
        console.error('error:', error);
        showAlert('오류가 발생했습니다.', 'danger');
    }
});

function showAlert(message, type = 'info') {
    const alertContainer = document.getElementById('alert-container');
    const wrapper = document.createElement('div');
    const alertId = 'alert-' + Date.now(); // Unique ID for each alert
    wrapper.innerHTML = [
        `<div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">`,
        `   <div>${message}</div>`,
        '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
        '</div>'
    ].join('');

    alertContainer.append(wrapper);

    // Automatically close the alert after 5 seconds
    const alertElement = document.getElementById(alertId);
    const bsAlert = new bootstrap.Alert(alertElement);
    setTimeout(() => {
        bsAlert.close();
    }, 5000);
}

function showConfirm(message, callback) {
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
    const confirmModalBody = document.getElementById('confirmModalBody');
    const confirmModalConfirmButton = document.getElementById('confirmModalConfirmButton');

    confirmModalBody.textContent = message;

    const confirmHandler = () => {
        callback();
        confirmModal.hide();
        confirmModalConfirmButton.removeEventListener('click', confirmHandler);
    };

    confirmModalConfirmButton.addEventListener('click', confirmHandler);

    confirmModal.show();
}
</script>

</html>
