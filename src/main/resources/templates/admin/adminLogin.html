<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>관리자 로그인</title>
</head>
<body>
	<div class="container mt-4">
		<div layout:fragment="content">
			<th:insert th:replace="~{layout}" />
			<div class="container mt-5 table-width-60">
				<div class="row justify-content-center">
					<div class="col-md-6 col-lg-4">
						<div class="card">
							<div class="card-header text-center">
								<h4>관리자 로그인</h4>
							</div>
							<div class="card-body">
								<form id="adminLogin">
									<div class="mb-3">
										<label for="adminId" class="form-label">관리자 아이디</label> <input
											type="text" class="form-control" id="adminId"
											name="adminId" required>
									</div>
									<div class="mb-3">
										<label for="password" class="form-label">관리자 비밀번호</label> <input
											type="password" class="form-control" id="password"
											name="password" required>
									</div>
									<button type="submit" class="btn btn-primary w-100">로그인</button>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<script>
document.getElementById('adminLogin').addEventListener('submit', async function(e) {
    e.preventDefault();  // 폼의 기본 제출 막기

    const formData = new FormData(this);

    const response = await fetch('/admin/login', {
        method: 'POST',
        body: formData
    });
    const result = await response.json();
            
    if(result.resultCode === null) {
        showAlert("회원 정보가 잘못 되었습니다.", "danger");
    } else {
    	showAlert("회원 입니다.", "success");
    }
});

</script>
</html>
